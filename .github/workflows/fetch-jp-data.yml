name: Fetch JustPark Data

on:
  workflow_dispatch:
  repository_dispatch:
    types: [jp-email-received]

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Set up Python
      run: uv python install 3.12

    - name: Install Playwright browsers
      run: |
        uv venv --python 3.12
        uv pip install playwright
        uv run playwright install --with-deps --only-shell chromium
    - name: Create session_state.json from secret
      run: |
        echo '${{ secrets.JP_SESSION_STATE }}' > session_state.json
    - name: Fetch JustPark data
      env:
        JP_API_KEY: ${{ secrets.JP_API_KEY }}
        JP_S3_BUCKET: ${{ secrets.JP_S3_BUCKET }}
        JP_S3_KEY: ${{ secrets.JP_S3_KEY }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        JP_SESSION_STATE: session_state.json

      run: |
        uv run scripts/fetch_jp_data.py

    - name: Prepare dashboard data
      env:
        JP_S3_BUCKET: ${{ secrets.JP_S3_BUCKET }}
        JP_S3_KEY: ${{ secrets.JP_S3_KEY }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      run: |
        PYTHONPATH=. uv run scripts/prepare_dashboard.py \
          "s3://${JP_S3_BUCKET}/${JP_S3_KEY}" \
          dashboard.json

    - name: Publish dashboard data
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
        JP_S3_BUCKET: ${{ secrets.JP_S3_BUCKET }}
        JP_S3_KEY: ${{ secrets.JP_S3_KEY }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: |
        set +e

        (
          cd web
          npx --yes wrangler@4.105.0 r2 object put \
            "${CLOUDFLARE_R2_BUCKET}/dashboard.json" \
            --file ../dashboard.json \
            --content-type application/json \
            --cache-control no-store \
            --remote
        ) &
        r2_pid=$!

        PYTHONPATH=. uv run scripts/gcal.py &
        calendar_pid=$!

        wait "$r2_pid"
        r2_status=$?
        wait "$calendar_pid"
        calendar_status=$?

        if [ "$r2_status" -ne 0 ] || [ "$calendar_status" -ne 0 ]; then
          echo "Publishing failed (R2: $r2_status, Google Calendar: $calendar_status)"
          exit 1
        fi

    - name: Upload debug screenshots on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: debug-screenshots-${{ github.run_number }}
        path: debug_screenshots/
        retention-days: 7
        if-no-files-found: ignore
